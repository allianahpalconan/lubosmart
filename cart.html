<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LubosMart | Your Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #3B1656;
            --primary-dark: #2A0F3F;
            --primary-light: #F1E9FA;
            --accent: #F5A623;
            --accent-dark: #DB8E10;
            --text: #221331;
            --muted: #746C80;
            --background: #FBFAFC;
            --white: #FFFFFF;
            --border: #E9E2F0;
            --shadow: 0 14px 34px rgba(43, 15, 63, 0.10);
        }

        body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); line-height: 1.5; }
        a { text-decoration: none; color: inherit; }
        button, input { font-family: inherit; }

        nav {
            height: 78px; padding: 0 7%; background: var(--white); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; box-shadow: 0 6px 16px rgba(43,15,63,.18); }
        .logo { font-family: 'Baloo 2', 'Inter', sans-serif; color: var(--primary) !important; font-size: 22px; font-weight: 700; }

        .nav-links { display: flex; align-items: center; gap: 34px; list-style: none; }
        .nav-links a { color: #524A5E; font-size: 13.5px; font-weight: 500; }
        .nav-links a:hover { color: var(--primary); }

        .nav-actions { display: flex; align-items: center; gap: 20px; }

        .cart-link {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 8px; font-size: 16px; color: var(--primary) !important;
        }
        .cart-badge {
            position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px;
            border-radius: 999px; background: var(--accent); color: var(--primary-dark);
            font-size: 10px; font-weight: 800; display: none; align-items: center; justify-content: center;
        }

        .signin { color: var(--text); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
        .start-btn { padding: 11px 20px; background: var(--accent) !important; color: var(--primary-dark) !important; border-radius: 8px; font-size: 13px; font-weight: 700; }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 60px 7% 100px;
        }

        .page h1 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 32px;
            color: var(--primary-dark);
            margin-bottom: 30px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .cart-items {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .cart-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .cart-row:last-child { border-bottom: none; }

        .cart-thumb {
            width: 54px; height: 54px; border-radius: 10px;
            background: var(--primary-light); color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; flex-shrink: 0;
        }

        .cart-info { flex: 1; min-width: 0; }
        .cart-name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
        .cart-price { color: var(--muted); font-size: 12px; }

        .qty-control {
            display: flex; align-items: center; gap: 10px;
            border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
        }

        .qty-control button {
            border: none; background: none; color: var(--primary); font-size: 14px; font-weight: 700; cursor: pointer; width: 18px;
        }

        .qty-control span { font-size: 12.5px; font-weight: 600; min-width: 14px; text-align: center; }

        .remove-btn {
            border: none; background: none; color: #B33131; font-size: 11px; font-weight: 600; cursor: pointer;
        }

        .cart-summary {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 26px;
        }

        .cart-summary h2 {
            font-family: 'Baloo 2', sans-serif;
            font-size: 18px;
            color: var(--primary-dark);
            margin-bottom: 18px;
        }

        .summary-row {
            display: flex; justify-content: space-between;
            font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
        }

        .summary-total {
            display: flex; justify-content: space-between;
            font-size: 15px; font-weight: 700; color: var(--primary-dark);
            padding-top: 14px; margin-top: 6px; border-top: 1px solid var(--border);
        }

        .checkout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkout-btn:hover { background: var(--accent-dark); }

        .empty-cart {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
        }

        .empty-cart p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

        .primary-btn {
            display: inline-flex; padding: 13px 22px;
            background: var(--primary); color: white;
            border-radius: 8px; font-size: 13px; font-weight: 700;
        }

        @media (max-width: 800px) {
            .nav-links { display: none; }
            .cart-layout { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .signin { display: none; }
            .cart-row { flex-wrap: wrap; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(43, 15, 63, 0.55);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--white);
            border-radius: 16px;
            padding: 34px 30px 26px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow);
            animation: modalPop 0.18s ease-out;
        }

        @keyframes modalPop {
            from { transform: scale(0.94); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .modal-title {
            font-family: 'Baloo 2', sans-serif;
            font-size: 18px;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .modal-message {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-icon.success {
            background: #E6F7EC;
            color: #2E9E5B;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-btn-primary {
            background: var(--accent);
            color: var(--primary-dark);
        }

        .modal-btn-primary:hover { background: var(--accent-dark); }

        .modal-btn-secondary {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .modal-btn-secondary:hover { background: #E3D4F2; }

    </style>

    <script src="js/auth.js"></script>

</head>

<body>

    <nav>

        <a href="index.html" class="brand">
            <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="60" height="60" rx="16" fill="#3B1656"/>
                <path d="M23 25 L25 19 C26 16.3 28 15 32 15 C36 15 38 16.3 39 19 L41 25" stroke="#2A0F3F" stroke-width="3" fill="none" stroke-linecap="round"/>
                <rect x="18" y="24" width="28" height="24" rx="5" fill="#F5A623"/>
                <circle cx="27.5" cy="34" r="2.4" fill="#2A0F3F"/>
                <circle cx="36.5" cy="34" r="2.4" fill="#2A0F3F"/>
                <path d="M27 40 Q32 43.5 37 40" stroke="#2A0F3F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                <path d="M23 24 C23 21 26 19.5 32 19.5 C38 19.5 41 21 41 24" stroke="#F5A623" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            </svg>
            <span class="logo">LubosMart</span>
        </a>

        <ul class="nav-links">
            <li><a href="shop.html">Shop</a></li>
            <li><a href="how-it-works.html">How it works</a></li>
            <li><a href="sell-with-us.html">Sell with us</a></li>
            <li><a href="about.html">About</a></li>
        </ul>

        <div class="nav-actions">
            <a href="cart.html" class="cart-link" aria-label="View cart">
                🛒
                <span class="cart-badge" id="cartCount">0</span>
            </a>
            <a href="login.html" class="signin" id="authLink">Sign in</a>
            <a href="shop.html" class="start-btn">Start shopping</a>
        </div>

    </nav>


    <div class="page">

        <h1>Your Cart</h1>

        <div id="cartContent"></div>

    </div>


    <div class="modal-overlay" id="signInModal">
        <div class="modal-box">
            <div class="modal-icon">🔒</div>
            <div class="modal-title">Sign in required</div>
            <div class="modal-message">Kailangan mo munang mag-sign in bago mag-checkout.</div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="modalCancelBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="modalSignInBtn">Sign in</button>
            </div>
        </div>
    </div>


    <div class="modal-overlay" id="orderSuccessModal">
        <div class="modal-box">
            <div class="modal-icon success">✓</div>
            <div class="modal-title">Order placed!</div>
            <div class="modal-message">Thanks for shopping local — you'll see this order on your dashboard.</div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-primary" id="orderSuccessCloseBtn" style="width:100%;">Okay</button>
            </div>
        </div>
    </div>


    <script src="assets/js/valora-storefront.js"></script>

    <script>

        const cartContent = document.getElementById("cartContent");

        function parsePrice(priceStr) {
            return Number(String(priceStr).replace(/[^\d.]/g, "")) || 0;
        }

        function formatPrice(n) {
            return "₱" + n.toLocaleString("en-PH");
        }

        function renderCart() {

            const cart = window.getValoraCart();

            if (cart.length === 0) {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <p>Your cart is empty. Let's find something good nearby.</p>
                        <a href="shop.html" class="primary-btn">Browse the shop →</a>
                    </div>
                `;
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + parsePrice(item.price) * item.qty, 0);
            const deliveryFee = subtotal > 0 ? 49 : 0;
            const total = subtotal + deliveryFee;

            cartContent.innerHTML = `
                <div class="cart-layout">

                    <div class="cart-items">
                        ${cart.map(item => `
                            <div class="cart-row" data-name="${item.name}">
                                <div class="cart-thumb">${item.name.charAt(0)}</div>
                                <div class="cart-info">
                                    <div class="cart-name">${item.name}</div>
                                    <div class="cart-price">${item.price} each</div>
                                </div>
                                <div class="qty-control">
                                    <button data-action="decrease">−</button>
                                    <span>${item.qty}</span>
                                    <button data-action="increase">+</button>
                                </div>
                                <button class="remove-btn" data-action="remove">Remove</button>
                            </div>
                        `).join("")}
                    </div>

                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
                        <div class="summary-row"><span>Delivery fee</span><span>${formatPrice(deliveryFee)}</span></div>
                        <div class="summary-total"><span>Total</span><span>${formatPrice(total)}</span></div>
                        <button class="checkout-btn" id="checkoutBtn">Checkout</button>
                    </div>

                </div>
            `;

            document.getElementById("checkoutBtn").addEventListener("click", handleCheckout);
        }

        const signInModal = document.getElementById("signInModal");
        const modalCancelBtn = document.getElementById("modalCancelBtn");
        const modalSignInBtn = document.getElementById("modalSignInBtn");

        function openSignInModal() {
            signInModal.classList.add("active");
        }

        function closeSignInModal() {
            signInModal.classList.remove("active");
        }

        modalCancelBtn.addEventListener("click", closeSignInModal);
        modalSignInBtn.addEventListener("click", function () {
            window.location.href = "login.html";
        });

        // Close kung ni-click sa labas ng modal box
        signInModal.addEventListener("click", function (event) {
            if (event.target === signInModal) closeSignInModal();
        });

        const orderSuccessModal = document.getElementById("orderSuccessModal");
        const orderSuccessCloseBtn = document.getElementById("orderSuccessCloseBtn");

        orderSuccessCloseBtn.addEventListener("click", function () {
            orderSuccessModal.classList.remove("active");
        });

        orderSuccessModal.addEventListener("click", function (event) {
            if (event.target === orderSuccessModal) {
                orderSuccessModal.classList.remove("active");
            }
        });

        function handleCheckout() {

            // Block checkout kung walang naka-sign in na user
            const session = window.getValoraSession ? window.getValoraSession() : null;

            if (!session) {
                openSignInModal();
                return;
            }

            window.valoraClearCart();
            orderSuccessModal.classList.add("active");
            renderCart();
        }

        cartContent.addEventListener("click", function (event) {

            const button = event.target.closest("button[data-action]");
            if (!button) return;

            const row = button.closest(".cart-row");
            const name = row.getAttribute("data-name");

            const cart = window.getValoraCart();
            const item = cart.find(i => i.name === name);
            if (!item) return;

            const action = button.getAttribute("data-action");

            if (action === "increase") {
                item.qty += 1;
            } else if (action === "decrease") {
                item.qty -= 1;
                if (item.qty <= 0) {
                    const idx = cart.indexOf(item);
                    cart.splice(idx, 1);
                }
            } else if (action === "remove") {
                const idx = cart.indexOf(item);
                cart.splice(idx, 1);
            }

            localStorage.setItem("valora_cart", JSON.stringify(cart));
            renderCart();

            const badge = document.getElementById("cartCount");
            if (badge) {
                const count = cart.reduce((sum, i) => sum + i.qty, 0);
                badge.textContent = count;
                badge.style.display = count > 0 ? "inline-flex" : "none";
            }
        });

        renderCart();

    </script>

</body>
</html>
