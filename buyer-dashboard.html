<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LubosMart | Buyer Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #3B1656;
            --primary-dark: #2A0F3F;
            --primary-light: #F1E9FA;
            --accent: #F5A623;
            --accent-dark: #DB8E10;
            --text: #221331;
            --muted: #746C80;
            --background: #FBFAFC;
            --white: #FFFFFF;
            --border: #E9E2F0;
            --shadow: 0 14px 34px rgba(43, 15, 63, 0.10);
        }

        body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text); line-height: 1.5; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; }

        nav {
            height: 78px; padding: 0 7%; background: var(--white); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; box-shadow: 0 6px 16px rgba(43,15,63,.18); }
        .logo { font-family: 'Baloo 2', 'Inter', sans-serif; color: var(--primary) !important; font-size: 22px; font-weight: 700; }

        .nav-actions { display: flex; align-items: center; gap: 20px; }

        .signout-btn {
            padding: 10px 18px; border: 1px solid var(--border); background: white; color: var(--primary);
            border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .signout-btn:hover { background: var(--primary-light); }

        .dash {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 7% 90px;
        }

        .dash-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; flex-wrap: wrap; gap: 16px;
        }

        .dash-header h1 { font-family: 'Baloo 2', sans-serif; font-size: 28px; color: var(--primary-dark); margin-bottom: 6px; }
        .dash-header p { color: var(--muted); font-size: 13px; }

        .dash-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .dash-card {
            background: white; border: 1px solid var(--border); border-radius: 12px; padding: 22px;
            box-shadow: 0 8px 25px rgba(43,15,63,.04);
        }

        .dash-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
        .dash-card .value { font-family: 'Baloo 2', sans-serif; font-size: 24px; color: var(--primary-dark); }

        .section-title { font-size: 16px; font-weight: 700; color: var(--primary-dark); margin-bottom: 16px; }

        .order-list {
            background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 40px;
        }

        .order-row {
            display: flex; align-items: center; justify-content: space-between; gap: 14px;
            padding: 18px 22px; border-bottom: 1px solid var(--border); font-size: 12.5px;
        }
        .order-row:last-child { border-bottom: none; }

        .order-name { font-weight: 600; }
        .order-meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

        .status-pill {
            padding: 5px 11px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
        }
        .status-delivered { background: #E4F3EC; color: #1F7A4C; }
        .status-transit { background: var(--accent-light, #FFF3DE); color: var(--accent-dark); }

        .empty-orders { padding: 40px 22px; text-align: center; color: var(--muted); font-size: 13px; }

        .quick-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

        .quick-link {
            background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px;
            text-align: center; font-size: 12.5px; font-weight: 600; color: var(--primary);
            box-shadow: 0 8px 25px rgba(43,15,63,.04); transition: 0.2s;
        }
        .quick-link:hover { border-color: #D8C3EC; transform: translateY(-3px); }

        @media (max-width: 800px) {
            .dash-cards, .quick-links { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 480px) {
            .dash-cards, .quick-links { grid-template-columns: 1fr; }
            .order-row { flex-direction: column; align-items: flex-start; }
        }

    </style>

    <script src="js/auth.js"></script>

</head>

<body>

    <nav>

        <a href="index.html" class="brand">
            <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="60" height="60" rx="16" fill="#3B1656"/>
                <path d="M23 25 L25 19 C26 16.3 28 15 32 15 C36 15 38 16.3 39 19 L41 25" stroke="#2A0F3F" stroke-width="3" fill="none" stroke-linecap="round"/>
                <rect x="18" y="24" width="28" height="24" rx="5" fill="#F5A623"/>
                <circle cx="27.5" cy="34" r="2.4" fill="#2A0F3F"/>
                <circle cx="36.5" cy="34" r="2.4" fill="#2A0F3F"/>
                <path d="M27 40 Q32 43.5 37 40" stroke="#2A0F3F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                <path d="M23 24 C23 21 26 19.5 32 19.5 C38 19.5 41 21 41 24" stroke="#F5A623" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            </svg>
            <span class="logo">LubosMart</span>
        </a>

        <div class="nav-actions">
            <a href="shop.html" class="signout-btn" style="border-color: var(--primary); color: white; background: var(--primary);">Shop</a>
            <button class="signout-btn" onclick="valoraLogout()">Sign out</button>
        </div>

    </nav>


    <div class="dash">

        <div class="dash-header">
            <div>
                <h1 id="welcomeHeading">Welcome back</h1>
                <p>Here's what's happening with your LubosMart account.</p>
            </div>
        </div>

        <div class="dash-cards">
            <div class="dash-card">
                <div class="label">Cart items</div>
                <div class="value" id="cartStat">0</div>
            </div>
            <div class="dash-card">
                <div class="label">Orders placed</div>
                <div class="value" id="ordersStat">0</div>
            </div>
            <div class="dash-card">
                <div class="label">Account type</div>
                <div class="value">Buyer</div>
            </div>
        </div>

        <div class="section-title">Recent Activity</div>

        <div class="order-list" id="orderList">
            <div class="empty-orders">No orders yet. Once you check out, your orders will show up here.</div>
        </div>

        <div class="section-title">Quick Links</div>

        <div class="quick-links">
            <a href="shop.html" class="quick-link">🛍️ Browse the shop</a>
            <a href="cart.html" class="quick-link">🛒 View your cart</a>
            <a href="index.html#deals" class="quick-link">🏷️ See today's deals</a>
        </div>

    </div>


    <script src="assets/js/valora-storefront.js"></script>

    <script>

        const session = requireValoraRole("buyer");

        if (session) {
            document.getElementById("welcomeHeading").textContent = "Welcome back, " + session.firstName;

            const cart = window.getValoraCart();
            const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById("cartStat").textContent = cartCount;
        }

    </script>

</body>
</html>
